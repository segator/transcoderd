apiVersion: v1
kind: Namespace
metadata:
  name: transcoderd-ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transcoderd-frontend
data:
  TR_FRONTEND_LISTEN: ":8081"
  TR_FRONTEND_API_URL: "http://transcoder-api.internal:8080"
  TR_FRONTEND_PUBLIC_URL: "https://transcoder.example.com"
  TR_FRONTEND_AUTH_MODE: "token"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoderd-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: transcoderd-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcoderd-frontend
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64, arm64]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Select a released multi-platform version/digest before using ARM64 nodes.
          image: ghcr.io/segator/transcoderd:frontend-main
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: transcoderd-frontend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: transcoderd-frontend
spec:
  selector:
    app.kubernetes.io/name: transcoderd-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transcoderd-frontend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - transcoder.example.com
  rules:
    - host: transcoder.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transcoderd-frontend
                port:
                  name: http
