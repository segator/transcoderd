schema: spec-driven

context: |
  TranscoderD is a distributed video transcoding system with server, workers, and PostgreSQL.
  Its Go module is transcoder and it requires Go 1.25.
  openspec/specs/ describes current behavior; openspec/BASELINE.md records scope and known gaps.
  openspec/CONFIGURATION.md and openspec/PROTOCOL.md provide the current settings and HTTP reference.
  Write all OpenSpec artifacts in English and retain the structural headings and SHALL/MUST terminology.
rules:
  specs:
    - Describe observable behavior with scenarios supported by code or tests; do not turn known bugs into desired requirements.
    - Include configuration defaults and their output effects when they form part of a capability's contract.
    - Preserve the exact capability path under openspec/specs/ when changing an existing capability.
  tasks:
    - Include tests for changed behavior and strict OpenSpec validation.
operations:
  apply:
    guidance:
      - Update the delta spec if implementation changes the observable contract.
      - Run relevant Go tests and openspec validate --all --strict before completing the change.
  archive:
    guidance:
      - Confirm the main specs describe the behavior actually delivered.
