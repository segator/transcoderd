name: Windows artifact debugger

on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: 'Trusted CI run containing Windows fixtures; validates scripts, never publishes a release'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  windows-debug:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate installer test network isolation
        shell: pwsh
        run: |
          . ./scripts/windows/test-network.ps1
          $name = 'TranscoderD-Network-Probe-' + [guid]::NewGuid().ToString('N')
          try {
            New-InstallerTestNetworkIsolation -Name $name -Program "$env:SystemRoot\System32\notepad.exe" | Out-Null
          } finally {
            Remove-NetFirewallRule -Name $name -ErrorAction SilentlyContinue
          }
      - name: Download existing fixtures for test debugging
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-worker
          path: dist
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Extract portable tools
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem dist -Filter '*-windows-amd64.zip')
          if ($archive.Count -ne 1) { throw 'Expected one Windows worker ZIP.' }
          $bundle = Join-Path $env:RUNNER_TEMP 'TranscoderD debug tools'
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $bundle
          "WINDOWS_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Validate normal installed service with current test scripts
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist -Filter '*-windows-amd64-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer.' }
          ./scripts/windows/test-ci.ps1 -Bundle $env:WINDOWS_BUNDLE `
            -TestBinary "$PWD/dist/windows-tests/windows-bundle.test.exe" `
            -ServerBinary "$PWD/dist/windows-tests/windows-e2e-server.exe" `
            -Fixture "$PWD/integration/testdata/e2e_fixture.mkv" `
            -EvidenceDirectory "$PWD/dist/windows-debug-installed" -DesktopInstaller $installer[0].FullName
      - name: Validate mandatory update and recovery with current test scripts
        shell: pwsh
        run: |
          ./scripts/windows/test-ci.ps1 -Bundle $env:WINDOWS_BUNDLE `
            -TestBinary "$PWD/dist/windows-tests/windows-bundle.test.exe" `
            -ServerBinary "$PWD/dist/windows-tests/windows-e2e-server.exe" `
            -Fixture "$PWD/integration/testdata/e2e_fixture.mkv" `
            -EvidenceDirectory "$PWD/dist/windows-debug-update" -UpdateFixtures "$PWD/dist/windows-update-fixtures"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-debug-test-logs
          path: |
            dist/windows-debug-installed/**/*.log
            dist/windows-debug-installed/**/*.err
            dist/windows-debug-update/**/*.log
            dist/windows-debug-update/**/*.err
