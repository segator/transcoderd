name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Complete missing Windows assets for an existing stable release from its exact tag'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

# Superseded PR commits cannot publish releases. Never cancel a main/release
# run, including another invocation completing missing Windows assets.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: transcoderd
    timeout-minutes: 90
    env:
      # Aggregate C/C++ budget on the shared 16-core Dagger Engine.
      WINDOWS_BUILD_JOBS: '16'
    outputs:
      release_tag: ${{ steps.release.outputs.tag_name || steps.source.outputs.release_tag }}
      release_publish: ${{ steps.release.outputs.release_created == 'true' || steps.source.outputs.release_tag != '' }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 0.20.6
      - uses: ./.github/actions/setup-mage

      - name: Prepare current CI tooling
        run: mage -compile "$RUNNER_TEMP/transcoderd-ci"

      - name: Test guards and resolve immutable release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '"$RUNNER_TEMP/transcoderd-ci" release:source'

      - name: Checkout validated tagged source
        if: steps.source.outputs.source_ref != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_ref }}

      - name: Test build tooling
        working-directory: magefiles
        run: go test ./...

      - name: Verify Windows release signing key
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          WINDOWS_UPDATE_SIGNING_KEY: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY }}
        run: go run ./cmd/windows-update-manifest key-check

      - name: Release please
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set release version
        if: steps.release.outputs.release_created
        run: echo "PROJECT_VERSION=v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}" >> "$GITHUB_ENV"

      - name: Set existing release version
        if: steps.source.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: echo "PROJECT_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Lint Linux and Windows
        run: mage lint:check lint:windows

      - name: Frontend PWA, resource and worker activity tests
        # The saved tooling remains available when source is an older release.
        run: '"$RUNNER_TEMP/transcoderd-ci" test:web'

      - name: Test
        run: mage test:unit

      - name: Build
        run: mage build:all

      - name: Validate Linux container images
        # Tagged source predates docker:check; retain its original target.
        run: mage ${{ steps.source.outputs.image_target }}

      - name: E2E Test
        timeout-minutes: 15
        run: mage test:e2e

      - name: Build Windows portable worker
        run: mage build:windows

      - name: Build Windows native test executables
        run: mage test:windowsBinaries

      - name: Build Windows desktop installer
        run: mage build:windowsInstaller

      - name: Build Windows update and recovery fixtures
        run: mage test:windowsUpdateFixtures

      - name: Upload Windows artifacts for native validation
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-worker
          path: |
            dist/*-windows-amd64.zip
            dist/*-windows-amd64-setup.exe
            dist/transcoderd-worker-windows-amd64.exe
            dist/transcoderd-desktop-service.exe
            dist/transcoderd-updater.exe
            dist/windows-update-manifest.exe
            dist/windows-installation-files.json
            dist/windows-tests/
            dist/windows-update-fixtures/
          # Installers and the portable bundle are already compressed.
          compression-level: 0
          retention-days: 7

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION_ALIASES: ${{ steps.release.outputs.release_created == 'true' && format('v{0}.{1},v{0}', steps.release.outputs.major, steps.release.outputs.minor) || '' }}
        run: mage publish:app

      - name: Export Linux release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.release_created
        run: mage docker:all

      - name: Upload release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: mage release:upload

  windows-native:
    needs: ci
    concurrency:
      group: windows-release-${{ needs.ci.outputs.release_tag || github.run_id }}
      cancel-in-progress: false
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.ci.outputs.source_ref }}
      - name: Validate installer test network isolation
        shell: pwsh
        run: |
          . ./scripts/windows/test-network.ps1
          $name = 'TranscoderD-Network-Probe-' + [guid]::NewGuid().ToString('N')
          try {
            New-InstallerTestNetworkIsolation -Name $name -Program "$env:SystemRoot\System32\notepad.exe" | Out-Null
          } finally {
            Remove-NetFirewallRule -Name $name -ErrorAction SilentlyContinue
          }
      - uses: actions/setup-go@v6
        if: needs.ci.outputs.source_ref != ''
        with:
          go-version: 1.26.10
          cache-dependency-path: go.sum
      - name: Legacy tagged-source frontend unit tests
        if: needs.ci.outputs.source_ref != ''
        shell: pwsh
        run: go test -v -timeout 2m ./frontend/...
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-worker
          path: dist
      - name: Extract portable worker
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem dist -Filter '*-windows-amd64.zip')
          if ($archive.Count -ne 1) { throw 'Expected one Windows worker ZIP.' }
          $bundle = Join-Path $env:RUNNER_TEMP 'TranscoderD portable con espacios'
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $bundle
          "WINDOWS_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Native unit tests and bundled media/OCR execution
        shell: pwsh
        run: |
          ./scripts/windows/run-tests.ps1 -TestDirectory "$PWD/dist/windows-tests" `
            -Bundle $env:WINDOWS_BUNDLE -Fixture "$PWD/integration/testdata/e2e_fixture.mkv"
      - name: Native Windows worker E2E with SVT-AV1 CPU
        shell: pwsh
        run: |
          ./scripts/windows/test-ci.ps1 -Bundle $env:WINDOWS_BUNDLE `
            -TestBinary "$PWD/dist/windows-tests/windows-bundle.test.exe" `
            -ServerBinary "$PWD/dist/windows-tests/windows-e2e-server.exe" `
            -Fixture "$PWD/integration/testdata/e2e_fixture.mkv" `
            -EvidenceDirectory "$PWD/dist/windows-e2e"
      - name: Desktop dashboard behavior
        shell: pwsh
        run: node ./scripts/windows/test-web-ui.cjs
      - name: Native Windows desktop pipe tests
        shell: pwsh
        run: |
          ./scripts/windows/test-desktop-pipe.ps1 -ServiceBinary "$PWD/dist/transcoderd-desktop-service.exe"
      - name: Installed Windows service E2E with SVT-AV1 CPU
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist -Filter '*-windows-amd64-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer.' }
          ./scripts/windows/test-ci.ps1 -Bundle $env:WINDOWS_BUNDLE `
            -TestBinary "$PWD/dist/windows-tests/windows-bundle.test.exe" `
            -ServerBinary "$PWD/dist/windows-tests/windows-e2e-server.exe" `
            -Fixture "$PWD/integration/testdata/e2e_fixture.mkv" `
            -EvidenceDirectory "$PWD/dist/windows-desktop-e2e" -DesktopInstaller $installer[0].FullName
      - name: Mandatory Windows update and recovery E2E
        shell: pwsh
        run: |
          ./scripts/windows/test-ci.ps1 -Bundle $env:WINDOWS_BUNDLE `
            -TestBinary "$PWD/dist/windows-tests/windows-bundle.test.exe" `
            -ServerBinary "$PWD/dist/windows-tests/windows-e2e-server.exe" `
            -Fixture "$PWD/integration/testdata/e2e_fixture.mkv" `
            -EvidenceDirectory "$PWD/dist/windows-update-e2e" -UpdateFixtures "$PWD/dist/windows-update-fixtures"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-native-test-logs
          path: |
            dist/windows-tests/*.log
            dist/windows-tests/*.err
            dist/windows-e2e/**/*.log
            dist/windows-e2e/**/*.err
            dist/windows-update-e2e/**/*.log
            dist/windows-update-e2e/**/*.err
      - name: Upload validated Windows release assets
        if: needs.ci.outputs.release_publish == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.ci.outputs.release_tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.ci.outputs.source_sha }}
          WINDOWS_UPDATE_SIGNING_KEY: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release.' }
          if ($release.draft -or $release.prerelease -or $release.tag_name -cne $env:RELEASE_TAG) { throw 'Expected stable published release.' }
          if (@($release.assets | Where-Object name -eq 'windows-update.json.sig').Count -ne 0) { throw 'Refusing to replace an already signed Windows release.' }
          $target = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tag.' }
          $target = $target.object
          for ($i = 0; $target.type -eq 'tag' -and $i -lt 6; $i++) {
            $annotation = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($target.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve annotated tag.' }
            $target = $annotation.object
          }
          if ($target.type -ne 'commit' -or $target.sha -cne $env:EXPECTED_SOURCE_SHA) { throw 'Release tag no longer matches validated source.' }
          if ((Get-Content version.txt -Raw).Trim() -cne $env:RELEASE_TAG.Substring(1)) { throw 'Release source version mismatch.' }
          $assets = @((Get-ChildItem dist -Filter '*-windows-amd64.zip').FullName)
          $assets += "$PWD/dist/transcoderd-worker-windows-amd64.exe"
          $assets += (Get-ChildItem dist -Filter '*-windows-amd64-setup.exe').FullName
          & "$PWD/dist/windows-update-manifest.exe" --version $env:RELEASE_TAG --installer $assets[-1] --files "$PWD/dist/windows-installation-files.json" --output "$PWD/dist"
          if ($LASTEXITCODE -ne 0) { throw 'Windows update metadata signing failed.' }
          & "$PWD/dist/windows-update-manifest.exe" verify "$PWD/dist"
          if ($LASTEXITCODE -ne 0) { throw 'Windows update metadata verification failed.' }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows release payload upload failed.' }
          gh release upload $env:RELEASE_TAG "$PWD/dist/windows-update.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows release manifest upload failed.' }
          # Eligibility is established only after every validated payload is available.
          gh release upload $env:RELEASE_TAG "$PWD/dist/windows-update.json.sig"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release signature upload failed.' }
