name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: jetify-com/devbox-install-action@v0.12.0

      - name: Release please
        if: github.event_name != 'pull_request'
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set release version
        if: steps.release.outputs.release_created
        run: echo "PROJECT_VERSION=v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: devbox run -- make test

      - name: Test AV1 benchmark lab
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # A versioned FFmpeg builder avoids silently reusing an older binary.
      # A missing builder is built once, then reused by later CI runs.
      - name: Ensure builder images exist
        run: |
          ffmpeg_image=$(make -s print-ffmpeg-builder-image)
          if ! docker manifest inspect "$ffmpeg_image" > /dev/null 2>&1; then
            echo "Image ${ffmpeg_image} not found, building and pushing..."
            make publish-builder-ffmpeg
          fi
          if ! docker manifest inspect ghcr.io/segator/transcoderd:builder-pgs > /dev/null 2>&1; then
            make publish-builder-pgs
          fi

      - name: Build
        run: devbox run -- make build

      - name: E2E Test
        run: devbox run -- make test-e2e

      - name: Publish
        if: github.event_name != 'pull_request'
        run: make publish

      - name: Publish release tags
        if: steps.release.outputs.release_created
        run: |
          PROJECT_VERSION=v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} make publish
          PROJECT_VERSION=v${{ steps.release.outputs.major }} make publish

      - name: Upload release assets
        if: steps.release.outputs.release_created
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} ./dist/* --clobber
