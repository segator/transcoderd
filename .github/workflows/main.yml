name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    runs-on: transcoderd
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 0.20.6
      - uses: ./.github/actions/setup-mage

      - name: Release please
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set release version
        if: steps.release.outputs.release_created
        run: echo "PROJECT_VERSION=v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}" >> "$GITHUB_ENV"

      - name: Test
        run: mage test:unit

      - name: Build
        run: mage build:all

      - name: Build Containers
        run: mage docker:all

      - name: E2E Test
        timeout-minutes: 15
        run: mage test:e2e

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION_ALIASES: ${{ steps.release.outputs.release_created == 'true' && format('v{0}.{1},v{0}', steps.release.outputs.major, steps.release.outputs.minor) || '' }}
        run: mage publish:app

      - name: Upload release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: mage release:upload
