name: ARC scale probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: probe-${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on: transcoderd
    steps:
      - name: Hold a runner briefly
        run: |
          echo "runner=$(hostname)"
          echo "visible_cpus=$(nproc)"
          sleep 60
