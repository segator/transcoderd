name: FFmpeg Dagger Cache Benchmark

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Cold or warm cache run; use the same workflow commit for both
        required: true
        type: choice
        options:
          - cold
          - warm

permissions:
  contents: read

jobs:
  ffmpeg-cache-benchmark:
    name: FFmpeg builder (${{ inputs.phase }} cache)
    runs-on: transcoderd
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build and export FFmpeg builder with Dagger
        env:
          DAGGER_LOG: "1"
        run: |
          echo "phase=${{ inputs.phase }}"
          echo "runner=$(hostname)"
          date -u +"started_at=%Y-%m-%dT%H:%M:%SZ"
          time mage docker:ffmpeg
          date -u +"finished_at=%Y-%m-%dT%H:%M:%SZ"
          du -h dist/builder-ffmpeg.tar
          rm -f dist/builder-ffmpeg.tar
