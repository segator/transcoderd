name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    runs-on: transcoderd
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Authenticate to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Release please
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set release version
        if: steps.release.outputs.release_created
        run: echo "PROJECT_VERSION=v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}" >> $GITHUB_ENV

      - name: Test
        run: mage test:unit

      - name: Test AV1 benchmark lab
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build
        run: mage build:all

      # Reuse the validated, versioned builders on ordinary app builds. If a
      # builder tag is missing, the Dagger target compiles and publishes it.
      - name: Ensure builder images exist
        run: |
          ffmpeg_image="ghcr.io/segator/transcoderd:builder-ffmpeg-9.0.2-av1"
          if ! crane manifest "$ffmpeg_image" > /dev/null 2>&1; then
            mage publish:ffmpeg
          fi
          if ! crane manifest ghcr.io/segator/transcoderd:builder-pgs > /dev/null 2>&1; then
            mage publish:pgs
          fi

      - name: Build Containers
        run: mage docker:all

      - name: E2E Test
        timeout-minutes: 15
        run: mage test:e2e

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mage publish:app

      - name: Publish release tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.release_created
        run: |
          PROJECT_VERSION=v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} mage publish:app
          PROJECT_VERSION=v${{ steps.release.outputs.major }} mage publish:app

      - name: Upload release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.release_created
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} ./dist/* --clobber
