<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="TranscoderD" />
    <link rel="manifest" href="/dashboard/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/dashboard/apple-touch-icon.png" />
    <script src="/dashboard/pwa.js" defer></script>
    <meta name="description" content="TranscoderD operations center" />
    <title>Sign in · TranscoderD</title>
    <link rel="icon" href="/dashboard/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/dashboard/styles.css" />
    <script src="/dashboard/login.js" defer></script>
  </head>
  <body class="login-body">
    <main class="login-layout">
      <section class="login-story" aria-label="TranscoderD">
        <a class="brand" href="/dashboard/"
          ><span class="brand-mark" aria-hidden="true">t<span>d</span></span
          ><span
            >transcoder<span class="brand-d">D</span
            ><small>OPERATIONS</small></span
          ></a
        >
      </section>
      <section class="login-panel">
        <div class="login-box">
          <span class="lock-icon" aria-hidden="true">⌁</span>
          <h2>Sign in</h2>
          <p></p>
          <form id="login-form">
            <label for="token">Access token</label>
            <div class="token-field">
              <input
                id="token"
                name="token"
                type="password"
                autocomplete="current-password"
                required
                maxlength="4096"
                placeholder="Your access token"
              /><button
                id="toggle-token"
                type="button"
                aria-label="Show token"
                aria-pressed="false"
              >
                View
              </button>
            </div>
            <p id="login-error" class="form-error" role="alert"></p>
            <button class="button primary login-submit" type="submit">
              Sign in <span aria-hidden="true">↗</span>
            </button>
          </form>
          <button
            id="pwa-install"
            class="button subtle pwa-install"
            type="button"
            hidden
          >
            Install app</button
          ><button
            id="pwa-update"
            class="button subtle pwa-update"
            type="button"
            hidden
          >
            Update ready · Reload
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
