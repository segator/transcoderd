<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e14" data-light="#f4f6fa" data-dark="#0b0e14" />
    <script src="/dashboard/theme.js"></script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="TranscoderD" />
    <link rel="manifest" href="/dashboard/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/dashboard/apple-touch-icon.png" />
    <script src="/dashboard/pwa.js" defer></script>
    <meta name="description" content="TranscoderD operations center" />
    <title>Sign in · TranscoderD</title>
    <link rel="icon" href="/dashboard/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/dashboard/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-layout">
      <section class="login-story" aria-label="TranscoderD">
        <a class="brand" href="/dashboard/"
          ><span class="brand-mark" aria-hidden="true">t<span>d</span></span
          ><span
            >transcoder<span class="brand-d">D</span
            ><small>OPERATIONS</small></span
          ></a
        >
      </section>
      <section class="login-panel">
        <div class="login-box">
          <div class="login-tools">
            <span class="lock-icon" aria-hidden="true">⌁</span>
            <button
              class="icon-button theme-toggle"
              type="button"
              data-theme-toggle
              aria-label="Dark theme"
              aria-pressed="true"
              hidden
            >
              <span aria-hidden="true">☀</span>
            </button>
          </div>
          <h2>Sign in</h2>
          <p></p>
          <a
            id="oidc-login"
            class="button primary login-submit"
            href="/dashboard/auth/login"
          >
            Sign in with SSO <span aria-hidden="true">↗</span>
          </a>
          <button
            id="pwa-install"
            class="button subtle pwa-install"
            type="button"
            hidden
          >
            Install app</button
          ><button
            id="pwa-update"
            class="button subtle pwa-update"
            type="button"
            hidden
          >
            Update ready · Reload
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
